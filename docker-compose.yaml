# Trimmed-down version of Apache Airflow's official quick-start compose file.
# Kept: postgres (metadata DB only), airflow-init (one-shot), scheduler, webserver.
# Dropped vs. the official file: redis, airflow-worker, flower, triggerer,
# airflow-cli — none of those are needed for LocalExecutor and dropping them
# is what keeps this inside the ~8GB memory budget.
#
# mem_limit on each service is a hard ceiling enforced by Docker (works with
# plain `docker compose up`, no swarm needed) so the stack fails loudly
# instead of quietly swapping the host to death.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__PARALLELISM: 4
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 4
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: 1
    AIRFLOW__WEBSERVER__WORKERS: 2
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__WEBSERVER__SECRET_KEY: 'fantasy-pipeline-dev-secret'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # Where DAG tasks running inside this container should read/write.
    SPARK_WAREHOUSE_DIR: /opt/airflow/data/spark-warehouse
    SPARK_METASTORE_DIR: /opt/airflow/data/metastore_db
    # Lets DAGs do `from scripts.whatever import run` regardless of which
    # dags/*.py file is parsing — scripts live in include/scripts/.
    PYTHONPATH: /opt/airflow/include
  volumes:
    # Git-pulled content — no rebuild/restart needed to pick up changes.
    - ./dags:/opt/airflow/dags
    - ./include:/opt/airflow/include
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
  user: "50000:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always
    mem_limit: 400m

  airflow-init:
    <<: *airflow-common
    container_name: fantasy-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags /opt/airflow/data
        chown -R 50000:0 /opt/airflow/logs /opt/airflow/dags /opt/airflow/data /opt/airflow/include
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_UPGRADE: 'true'
    user: "0:0"
    mem_limit: 1g

  airflow-webserver:
    <<: *airflow-common
    container_name: fantasy-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    mem_limit: 1200m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    container_name: fantasy-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always
    # Highest limit of the three: the Spark JVM for the smoke-test task
    # runs as a child process of the scheduler under LocalExecutor.
    mem_limit: 3000m
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres-db-volume:
